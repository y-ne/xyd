[package]
name = "xyd"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = [
	"rt-multi-thread",
	"macros",
	"net",
	"sync",
	"rt",
] }
serde = { version = "1", features = ["derive"] }
portable-pty = "0.9"

[profile.release]
opt-level = "z"
lto = true
strip = true
codegen-units = 1

[package.metadata.ndk]
target-api = 23
